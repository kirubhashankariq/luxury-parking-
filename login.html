<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z'/><path d='m9 12 2 2 4-4'/></svg>">
  <title>Client Gateway // VELOCE LUXE</title>
  <meta name="description"
    content="Encrypted access portal and membership registration for Veloce Luxe vehicle vault members." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            gold: {
              50: '#fdfbf4', 100: '#fbf5e4', 200: '#f5e8c4', 300: '#ecd397', 400: '#e5c057',
              500: '#d4af37', 600: '#bf992e', 700: '#a17c22', 800: '#856420', 900: '#71541b', 950: '#412e0b'
            },
            obsidian: { 800: '#1f1f1f', 900: '#121212', 950: '#0a0a0a' }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Space Grotesk"', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Unified Ultra-Luxury Responsive CSS -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-heading: 'Space Grotesk', sans-serif;
      --bg-primary: #F5F5F7;
      --bg-card: #F5F5F7;
      --text-primary: #1A1A1A;
      --text-secondary: #4A4A4A;
      --text-muted: #8F8F8F;
      --border-light: rgba(255, 255, 255, 0.9);
      --border-subtle: rgba(180, 180, 180, 0.2);
      --accent-primary: #d4af37;
      --accent-glow: rgba(212, 175, 55, 0.4);
      --neu-flat: 9px 9px 18px #d5d5d7, -9px -9px 18px #ffffff;
      --neu-flat-sm: 5px 5px 10px #d9d9db, -5px -5px 10px #ffffff;
      --neu-flat-lg: 15px 15px 30px #cecece, -15px -15px 30px #ffffff;
      --neu-pressed: inset 5px 5px 10px #d5d5d7, inset -5px -5px 10px #ffffff;
      --nav-bg: rgba(245, 245, 247, 0.92);
      --toast-bg: rgba(255, 255, 255, 0.95);
    }

    [data-theme="dark"] {
      --bg-primary: #121212;
      --bg-secondary: #1A1A1A;
      --bg-card: #121212;
      --text-primary: #F5F5F7;
      --text-secondary: #A3A3A3;
      --text-muted: #666666;
      --border-light: rgba(255, 255, 255, 0.05);
      --border-subtle: rgba(255, 255, 255, 0.02);
      --accent-primary: #d4af37;
      --accent-glow: rgba(212, 175, 55, 0.25);
      --neu-flat: 8px 8px 16px #0b0b0b, -8px -8px 16px #191919;
      --neu-flat-sm: 4px 4px 8px #0d0d0d, -4px -4px 8px #171717;
      --neu-flat-lg: 12px 12px 24px #090909, -12px -12px 24px #1b1b1b;
      --neu-pressed: inset 4px 4px 8px #0b0b0b, inset -4px -4px 8px #16233a;
      --nav-bg: rgba(18, 18, 18, 0.92);
      --toast-bg: rgba(26, 26, 26, 0.98);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    h1,
    h2 {
      font-family: var(--font-heading);
      color: var(--text-primary);
    }

    .ambient-background {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.15;
    }

    [data-theme="dark"] .ambient-orb {
      opacity: 0.08;
    }

    .ambient-orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #d4af37 0%, transparent 70%);
      top: -10%;
      left: -5%;
    }

    .ambient-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--border-subtle) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.7;
    }

    .neu-card,
    .neu-card-lg {
      background: var(--bg-card);
      box-shadow: var(--neu-flat);
      border-radius: 20px;
      border: 1px solid var(--border-light);
    }

    .neu-card-lg {
      border-radius: 28px;
      box-shadow: var(--neu-flat-lg);
    }

    .neu-inset {
      background: var(--bg-card);
      box-shadow: var(--neu-pressed);
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
    }

    .neu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: var(--neu-flat-sm);
      border-radius: 12px;
      border: 1px solid var(--border-light);
      font-weight: 700;
      padding: 0.75rem 1.6rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .neu-btn:hover {
      box-shadow: var(--neu-flat);
      transform: translateY(-2px);
      color: var(--accent-primary);
    }

    .neu-btn-primary {
      background: linear-gradient(135deg, #d4af37, #a17c22);
      color: #121212 !important;
      box-shadow: 0 6px 18px var(--accent-glow), var(--neu-flat-sm);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .neu-btn-silver {
      background: linear-gradient(135deg, #e6e6e6, #cccccc);
      color: #121212 !important;
      box-shadow: var(--neu-flat-sm);
    }

    [data-theme="dark"] .neu-btn-silver {
      background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
      color: #F5F5F7 !important;
    }

    .neu-icon-btn {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--bg-card);
      box-shadow: var(--neu-flat-sm);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .neu-icon-btn:hover {
      box-shadow: var(--neu-flat);
      color: var(--accent-primary);
      transform: translateY(-2px);
    }

    .neu-input {
      width: 100%;
      background: var(--bg-card);
      box-shadow: var(--neu-pressed);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 0.85rem 1.2rem;
      color: var(--text-primary);
      outline: none;
    }

    .neu-input:focus {
      border-color: var(--accent-primary);
      box-shadow: var(--neu-pressed), 0 0 0 3px var(--accent-glow);
    }

    .metallic-text {
      background: linear-gradient(135deg, #71541b 0%, #d4af37 50%, #412e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    [data-theme="dark"] .metallic-text {
      background: linear-gradient(135deg, #f5e8c4 0%, #d4af37 50%, #a17c22 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    #toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      max-width: 400px;
      width: calc(100vw - 3rem);
      pointer-events: none;
    }

    .toast-message {
      pointer-events: auto;
      background: var(--toast-bg);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: 1px solid var(--accent-primary);
      box-shadow: 0 10px 30px var(--accent-glow);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      transform: translateX(120%);
      opacity: 0;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }

    .toast-message.toast-visible {
      transform: translateX(0);
      opacity: 1;
    }

    .toast-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--accent-primary);
      color: #121212;
    }
  </style>
</head>

<body class="selection:bg-gold-500 selection:text-black">

  <div class="ambient-background" aria-hidden="true">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-grid"></div>

  <!-- Top Action & Navigation Header -->
  <header class="w-full px-4 sm:px-6 py-6 flex items-center justify-between max-w-7xl mx-auto z-20">

      <!-- ============================================== -->
      <!-- FORM 1: SIGN IN (LOGIN) - Hidden by default -->
      <!-- ============================================== -->

              Key / Email</label>
            <div class="relative">
              <input type="email" required value="sterling@apexcapital.co" class="neu-input text-xs pl-10" />
              <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            </div>

        </a>

    </div>
  </main>

  <!-- Core Javascript Interactions -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      const html = document.documentElement;

      // Theme Toggle
      const themeToggleBtns = document.querySelectorAll('.themeToggleBtn');
      themeToggleBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const isDark = html.getAttribute('data-theme') === 'dark';
          html.setAttribute('data-theme', isDark ? 'light' : 'dark');
          document.querySelectorAll('.icon-sun').forEach(el => isDark ? el.classList.remove('hidden') : el.classList.add('hidden'));
          document.querySelectorAll('.icon-moon').forEach(el => isDark ? el.classList.add('hidden') : el.classList.remove('hidden'));
        });
      });

      // RTL Toggle
      const rtlToggleBtns = document.querySelectorAll('.rtlToggleBtn');
      rtlToggleBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          html.setAttribute('dir', html.getAttribute('dir') === 'ltr' ? 'rtl' : 'ltr');
        });
      });

      // Toast System
      window.showToast = function (title, desc) {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast-message toast-visible';
        toast.innerHTML = `<div class="toast-icon-wrap"><i data-lucide="check" class="w-5 h-5"></i></div><div><div class="font-bold text-sm">${title}</div><div class="text-xs opacity-80">${desc}</div></div>`;
        container.appendChild(toast);
        lucide.createIcons();
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 4000);
      };

      // Tab Swapping Logic (Sign Up is active by default)
      window.switchTab = function (type) {
        const loginBtn = document.getElementById('tabLoginBtn');
        const signupBtn = document.getElementById('tabSignupBtn');
        const loginForm = document.getElementById('formLoginContainer');
        const signupForm = document.getElementById('formSignupContainer');

        if (type === 'login') {
          loginBtn.className = "py-2.5 rounded-xl text-xs font-bold transition-all bg-gold-500 text-obsidian-900 shadow-md";
          signupBtn.className = "py-2.5 rounded-xl text-xs font-bold text-slate-500 dark:text-slate-400 transition-all";
          loginForm.classList.remove('hidden');
          signupForm.classList.add('hidden');
        } else {
          signupBtn.className = "py-2.5 rounded-xl text-xs font-bold transition-all bg-gold-500 text-obsidian-900 shadow-md";
          loginBtn.className = "py-2.5 rounded-xl text-xs font-bold text-slate-500 dark:text-slate-400 transition-all";
          signupForm.classList.remove('hidden');
          loginForm.classList.add('hidden');
        }
      };

      // Social Login Simulation
      window.simulateSocialLogin = function (provider) {
        showToast(`${provider} Authentication`, `Establishing secure handshake with ${provider} Gateway...`);
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
      };
    });
  </script>
</body>

</html>

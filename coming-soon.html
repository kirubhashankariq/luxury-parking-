<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">

<head>
    <meta charset="UTF-8" />
<script>
  (function() {
    const savedTheme = localStorage.getItem('veloce_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    const savedDir = localStorage.getItem('veloce_dir') || 'ltr';
    document.documentElement.setAttribute('dir', savedDir);
  })();
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z'/><path d='m9 12 2 2 4-4'/></svg>">
    <title>Coming Soon // VELOCE LUXE</title>
    <meta name="description"
        content="Get Started and client dashboard modules are currently undergoing encrypted security upgrades. Launching soon." />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                extend: {
                    colors: {
                        gold: {
                            50: '#fdfbf4', 100: '#fbf5e4', 200: '#f5e8c4', 300: '#ecd397', 400: '#e5c057',
                            500: '#d4af37', 600: '#bf992e', 700: '#a17c22', 800: '#856420', 900: '#71541b', 950: '#412e0b'
                        },
                        obsidian: { 800: '#1f1f1f', 900: '#121212', 950: '#0a0a0a' }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        heading: ['"Space Grotesk"', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

        :root {
            --bg-primary: #F5F5F7;
            --bg-card: #F5F5F7;
            --text-primary: #1A1A1A;
            --text-secondary: #4A4A4A;
            --text-muted: #8F8F8F;
            --border-light: rgba(255, 255, 255, 0.9);
            --border-subtle: rgba(180, 180, 180, 0.2);
            --accent-primary: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.4);
            --neu-flat: 9px 9px 18px #d5d5d7, -9px -9px 18px #ffffff;
            --neu-flat-sm: 5px 5px 10px #d9d9db, -5px -5px 10px #ffffff;
            --neu-flat-lg: 15px 15px 30px #cecece, -15px -15px 30px #ffffff;
            --neu-pressed: inset 5px 5px 10px #d5d5d7, inset -5px -5px 10px #ffffff;
            --toast-bg: rgba(255, 255, 255, 0.95);
        }

        [data-theme="dark"] {
            --bg-primary: #121212;
            --bg-card: #121212;
            --text-primary: #F5F5F7;
            --text-secondary: #A3A3A3;
            --text-muted: #666666;
            --border-light: rgba(255, 255, 255, 0.05);
            --border-subtle: rgba(255, 255, 255, 0.02);
            --accent-primary: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.25);
            --neu-flat: 8px 8px 16px #0b0b0b, -8px -8px 16px #191919;
            --neu-flat-sm: 4px 4px 8px #0d0d0d, -4px -4px 8px #171717;
            --neu-flat-lg: 12px 12px 24px #090909, -12px -12px 24px #1b1b1b;
            --neu-pressed: inset 4px 4px 8px #0b0b0b, inset -4px -4px 8px #16233a;
            --toast-bg: rgba(26, 26, 26, 0.98);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        h1,
        h2,
        h3 {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-primary);
        }

        .ambient-background {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.15;
        }

        [data-theme="dark"] .ambient-orb {
            opacity: 0.08;
        }

        .ambient-orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #d4af37 0%, transparent 70%);
            top: -10%;
            left: -5%;
        }

        .ambient-grid {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(var(--border-subtle) 1px, transparent 1px);
            background-size: 36px 36px;
            opacity: 0.7;
        }

        .neu-card-lg {
            background: var(--bg-card);
            box-shadow: var(--neu-flat-lg);
            border-radius: 28px;
            border: 1px solid var(--border-light);
        }

        .neu-inset {
            background: var(--bg-card);
            box-shadow: var(--neu-pressed);
            border-radius: 16px;
            border: 1px solid var(--border-subtle);
        }

        .neu-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: var(--neu-flat-sm);
            border-radius: 12px;
            border: 1px solid var(--border-light);
            font-weight: 700;
            padding: 0.75rem 1.6rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .neu-btn:hover {
            box-shadow: var(--neu-flat);
            transform: translateY(-2px);
            color: var(--accent-primary);
        }

        .neu-btn-primary {
            background: linear-gradient(135deg, #d4af37, #a17c22);
            color: #121212 !important;
            box-shadow: 0 6px 18px var(--accent-glow), var(--neu-flat-sm);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .neu-input {
            width: 100%;
            background: var(--bg-card);
            box-shadow: var(--neu-pressed);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 0.85rem 1.2rem;
            color: var(--text-primary);
            outline: none;
        }

        .metallic-text {
            background: linear-gradient(135deg, #71541b 0%, #d4af37 50%, #412e0b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            max-width: 400px;
            width: calc(100vw - 3rem);
            pointer-events: none;
        }

        .toast-message {
            pointer-events: auto;
            background: var(--toast-bg);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid var(--accent-primary);
            box-shadow: 0 10px 30px var(--accent-glow);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.85rem;
            transform: translateX(120%);
            opacity: 0;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        .toast-message.toast-visible {
            transform: translateX(0);
            opacity: 1;
        }
    </style>
</head>

<body>

    <div class="ambient-background" aria-hidden="true">
        <div class="ambient-orb ambient-orb-1"></div>
        <div class="ambient-grid"></div>
    </div>

    <div id="toast-container"></div>

    <!-- Coming Soon Card Container -->
    <div class="neu-card-lg p-8 sm:p-12 max-w-md w-full text-center relative border border-gold-500/20">

        <div
            class="w-16 h-16 rounded-2xl neu-inset flex items-center justify-center text-gold-500 mx-auto mb-6 shadow-inner">
            <i data-lucide="lock" class="w-8 h-8"></i>
        </div>

        <div class="metallic-badge mb-4">Security Upgrade in Progress</div>
        <h1 class="text-3xl font-extrabold font-heading mb-3">Get Started Launching Soon</h1>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mb-8 leading-relaxed">
            Our customer dashboard and client onboarding portals are currently undergoing high-voltage security
            enhancements. Enter your private email for priority beta access.
        </p>

        <form id="comingSoonForm" class="space-y-4 mb-6">
            <input type="email" required placeholder="Enter private email address..."
                class="neu-input text-xs sm:text-sm py-3.5" />
            <button type="submit"
                class="neu-btn neu-btn-primary w-full py-3.5 text-xs sm:text-sm font-bold justify-center shadow-xl">
                <i data-lucide="bell" class="w-4 h-4"></i>
                <span>Notify Me Upon Launch</span>
            </button>
        </form>

        <a href="index.html"
            class="text-xs font-bold text-gold-600 dark:text-gold-500 hover:underline inline-flex items-center gap-1.5">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Return to Vault Home
        </a>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            const form = document.getElementById('comingSoonForm');
            const toastContainer = document.getElementById('toast-container');

            function showToast(title, desc) {
                const toast = document.createElement('div');
                toast.className = 'toast-message toast-visible';
                toast.innerHTML = `
          <div class="w-8 h-8 rounded-lg bg-gold-500 flex items-center justify-center text-obsidian-900"><i data-lucide="check" class="w-4 h-4"></i></div>
          <div><div class="font-bold text-sm">${title}</div><div class="text-xs opacity-80">${desc}</div></div>
        `;
                toastContainer.appendChild(toast);
                lucide.createIcons();
                setTimeout(() => {
                    toast.style.opacity = '0';
                    setTimeout(() => toast.remove(), 400);
                }, 4000);
            }

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                showToast('Priority Registry Added', 'You will receive secure credentials upon portal deployment.');
                form.reset();
            });
        });
    </script>
</body>

</html>

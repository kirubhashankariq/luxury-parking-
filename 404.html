<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">

<head>
  <meta charset="UTF-8" />
<script>
  (function() {
    const savedTheme = localStorage.getItem('veloce_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    const savedDir = localStorage.getItem('veloce_dir') || 'ltr';
    document.documentElement.setAttribute('dir', savedDir);
  })();
</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23d4af37' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z'/><path d='m9 12 2 2 4-4'/></svg>">
  <title>Sector Not Found (404) // VELOCE LUXE</title>
  <meta name="description"
    content="The requested atmospheric chamber or subterranean coordinates do not exist in our security ledger." />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            gold: {
              50: '#fdfbf4', 100: '#fbf5e4', 200: '#f5e8c4', 300: '#ecd397', 400: '#e5c057',
              500: '#d4af37', 600: '#bf992e', 700: '#a17c22', 800: '#856420', 900: '#71541b', 950: '#412e0b'
            },
            obsidian: { 800: '#1f1f1f', 900: '#121212', 950: '#0a0a0a' }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            heading: ['"Space Grotesk"', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --bg-primary: #F5F5F7;
      --bg-card: #F5F5F7;
      --text-primary: #1A1A1A;
      --text-secondary: #4A4A4A;
      --text-muted: #8F8F8F;
      --border-light: rgba(255, 255, 255, 0.9);
      --border-subtle: rgba(180, 180, 180, 0.2);
      --accent-primary: #d4af37;
      --accent-glow: rgba(212, 175, 55, 0.4);
      --neu-flat: 9px 9px 18px #d5d5d7, -9px -9px 18px #ffffff;
      --neu-flat-sm: 5px 5px 10px #d9d9db, -5px -5px 10px #ffffff;
      --neu-flat-lg: 15px 15px 30px #cecece, -15px -15px 30px #ffffff;
      --neu-pressed: inset 5px 5px 10px #d5d5d7, inset -5px -5px 10px #ffffff;
    }

    [data-theme="dark"] {
      --bg-primary: #121212;
      --bg-card: #121212;
      --text-primary: #F5F5F7;
      --text-secondary: #A3A3A3;
      --text-muted: #666666;
      --border-light: rgba(255, 255, 255, 0.05);
      --border-subtle: rgba(255, 255, 255, 0.02);
      --accent-primary: #d4af37;
      --accent-glow: rgba(212, 175, 55, 0.25);
      --neu-flat: 8px 8px 16px #0b0b0b, -8px -8px 16px #191919;
      --neu-flat-sm: 4px 4px 8px #0d0d0d, -4px -4px 8px #171717;
      --neu-flat-lg: 12px 12px 24px #090909, -12px -12px 24px #1b1b1b;
      --neu-pressed: inset 4px 4px 8px #0b0b0b, inset -4px -4px 8px #16233a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    h1,
    h2 {
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text-primary);
    }

    .ambient-background {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.15;
    }

    [data-theme="dark"] .ambient-orb {
      opacity: 0.08;
    }

    .ambient-orb-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #d4af37 0%, transparent 70%);
      top: -10%;
      left: -5%;
    }

    .ambient-grid {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(var(--border-subtle) 1px, transparent 1px);
      background-size: 36px 36px;
      opacity: 0.7;
    }

    .neu-card-lg {
      background: var(--bg-card);
      box-shadow: var(--neu-flat-lg);
      border-radius: 28px;
      border: 1px solid var(--border-light);
    }

    .neu-inset {
      background: var(--bg-card);
      box-shadow: var(--neu-pressed);
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
    }

    .neu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      background: var(--bg-card);
      color: var(--text-primary);
      box-shadow: var(--neu-flat-sm);
      border-radius: 12px;
      border: 1px solid var(--border-light);
      font-weight: 700;
      padding: 0.75rem 1.6rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .neu-btn:hover {
      box-shadow: var(--neu-flat);
      transform: translateY(-2px);
      color: var(--accent-primary);
    }

    .neu-btn-primary {
      background: linear-gradient(135deg, #d4af37, #a17c22);
      color: #121212 !important;
      box-shadow: 0 6px 18px var(--accent-glow), var(--neu-flat-sm);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .neu-btn-silver {
      background: linear-gradient(135deg, #e6e6e6, #cccccc);
      color: #121212 !important;
      box-shadow: var(--neu-flat-sm);
    }

    [data-theme="dark"] .neu-btn-silver {
      background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
      color: #F5F5F7 !important;
    }

    .metallic-text {
      background: linear-gradient(135deg, #71541b 0%, #d4af37 50%, #412e0b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>

<body class="selection:bg-gold-500 selection:text-black">

  <div class="ambient-background" aria-hidden="true">
    <div class="ambient-orb ambient-orb-1"></div>
    <div class="ambient-grid"></div>
  </div>

  <!-- 404 Neumorphic Card[cite: 18] -->
  <div class="neu-card-lg p-8 sm:p-14 max-w-lg w-full text-center relative border border-gold-500/20">

    <div
      class="w-20 h-20 rounded-3xl neu-inset flex items-center justify-center text-gold-500 mx-auto mb-6 shadow-inner">
      <i data-lucide="compass" class="w-10 h-10 animate-spin" style="animation-duration: 12s;"></i>
    </div>

    <div class="text-6xl sm:text-7xl font-extrabold font-heading metallic-text mb-3">
      404
    </div>

    <h1 class="text-2xl font-bold font-heading mb-2">Vault Sector Undefined</h1>
    <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 max-w-sm mx-auto mb-8 leading-relaxed font-medium">
      The requested atmospheric chamber or subterranean coordinates do not exist in our security ledger.
    </p>

    <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
      <a href="index.html" class="neu-btn neu-btn-primary w-full sm:w-auto text-xs py-3.5 px-6 font-bold shadow-lg">
        <i data-lucide="home" class="w-4 h-4"></i>
        <span>Return to Vault Home</span>
      </a>
      <a href="services.html" class="neu-btn neu-btn-silver w-full sm:w-auto text-xs py-3.5 px-6 font-bold">
        <i data-lucide="layers" class="w-4 h-4 text-gold-500"></i>
        <span>Explore Services</span>
      </a>
    </div>

  </div>

  <script>lucide.createIcons();</script>
</body>

</html>
